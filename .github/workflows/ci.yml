name: CI

on:
  push:
    branches: [ master, feature/** ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore dependencies
        run: dotnet restore ServerLib.Tests/ServerLib.Tests.csproj

      - name: Build
        run: dotnet build ServerLib.Tests/ServerLib.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ServerLib.Tests/ServerLib.Tests.csproj --configuration Release --no-build --verbosity normal
