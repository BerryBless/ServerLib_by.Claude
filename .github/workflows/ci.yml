name: CI

on:
  push:
    branches: [ master, feature/** ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore dependencies
        run: dotnet restore ClaudeCodeStudy.sln

      - name: Build
        run: dotnet build ClaudeCodeStudy.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ClaudeCodeStudy.sln --configuration Release --no-build --verbosity normal
